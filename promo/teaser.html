<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قافیه‌باز — تیزر</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #efe9dc; font-family: Vazirmatn, Tahoma, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { height: 96vh; aspect-ratio: 9 / 16; background: #0f0f0e; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 22px; font: inherit; font-weight: 700;
          background: #ff5b1f; color: #0f0f0e; border: 0; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="play">▶ پخش تیزر</button>
<script>
/*
 * قافیه‌باز teaser — 9:16, 8 bars (~20 s) synced to "Oldskool Loop" by makshahn (CC0, Freesound).
 * Open this page and press play to preview; scripts/render-teaser.mjs records it to MP4 with window.renderTeaser().
 */
(function () {
  var W = 1080, H = 1920;
  var BEAT_URL = "https://cdn.freesound.org/previews/149/149015_2675426-hq.mp3";
  var BPM_HINT = 95, BARS = 10;
  var START_BAR = 4;   // bars 0–3 of the loop include a drum break (bar 3) — start where the drums run straight
  var C = { bg: "#0f0f0e", surface: "#181816", line: "#37352f", text: "#efe9dc", muted: "#8f8a7d",
            accent: "#ff5b1f", ink: "#0f0f0e", r: ["#ff5b1f", "#ffd23f", "#efe9dc", "#ff5c93"] };
  var DISPLAY = "Lalezar, Vazirmatn, sans-serif", BODY = "Vazirmatn, sans-serif";
  var canvas = document.getElementById("c"), g = canvas.getContext("2d");

  /* ---------- tiny animation helpers ---------- */
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function outBack(x) { x = clamp(x); var c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function outCubic(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function text(str, x, y, size, color, font, align) {
    g.font = size + "px " + (font || DISPLAY); g.fillStyle = color; g.textAlign = align || "center"; g.direction = "rtl"; g.textBaseline = "middle";
    g.fillText(str, x, y);
  }
  /* poster-style text: orange misprint shadow under bone text */
  function inkText(str, x, y, size, a) {
    g.save(); g.globalAlpha = a == null ? 1 : a;
    text(str, x + size * 0.045, y + size * 0.035, size, C.accent);
    text(str, x, y, size, C.text);
    g.restore();
  }
  /* pop-in: scale from big + fade, triggered at time `at` (in beats) */
  function pop(beat, at, dur) { var p = (beat - at) / (dur || 0.5); return { p: clamp(p), s: p < 0 ? 0 : 1 + (1 - outBack(p)) * 0.6, a: clamp(p * 3) }; }

  // static grain texture
  var grain = document.createElement("canvas"); grain.width = 360; grain.height = 640;
  (function () { var gc = grain.getContext("2d"), im = gc.createImageData(360, 640);
    for (var i = 0; i < im.data.length; i += 4) { var v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 18; }
    gc.putImageData(im, 0, 0); })();

  /* ---------- scenes (beat = quarter notes since the start) ---------- */
  function background(beat) {
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    g.drawImage(grain, 0, 0, W, H);
    // kick pulse: a thin accent bar that swells on every beat
    var ph = beat - Math.floor(beat), k = Math.exp(-ph * 6);
    g.fillStyle = C.accent; g.globalAlpha = 0.85;
    g.fillRect(0, H - 14 - k * 10, W, 14 + k * 10);
    g.globalAlpha = 1;
  }

  function sceneHook(beat) {   // bar 0: one word per beat
    var words = ["می‌خوای", "فری‌استایل", "رپ", "کنی؟"];
    for (var i = 0; i < 4; i++) {
      var p = pop(beat, i, 0.45); if (!p.p && beat < i) continue;
      g.save(); g.translate(W / 2, 560 + i * 250); g.scale(p.s, p.s); g.globalAlpha = p.a;
      var size = i === 1 ? 190 : 210;
      if (i === 3) { text(words[i], 6, 6, size, C.accent); text(words[i], 0, 0, size, C.text); }
      else text(words[i], 0, 0, size, i === 1 ? C.accent : C.text);
      g.restore();
    }
  }

  function sceneTagline(beat) {   // bar 1
    var b = beat - 4, p1 = pop(b, 0, 0.5), p2 = pop(b, 2, 0.5);
    g.save(); g.translate(W / 2, 820); g.scale(p1.s, p1.s); g.globalAlpha = p1.a; inkText("ضرب رو بگیر،", 0, 0, 150); g.restore();
    if (b >= 2) { g.save(); g.translate(W / 2, 1060); g.scale(p2.s, p2.s); g.globalAlpha = p2.a; inkText("قافیه رو ما می‌دیم.", 0, 0, 132); g.restore(); }
  }

  /* bars 2–4: the actual game grid, ball and rhymes */
  var WORDS = [["بهار", 0], ["قرار", 0], ["خیابون", 1], ["بارون", 1], ["رفیق", 3], ["عمیق", 3], ["فرار", 0]];

  /* A sample freestyle over those bars, shown karaoke-style. Natural, with the slips real freestyles have:
     a filler, a self-correction and a stumble. Each token: [text, beat within the bar (0–3.x), kind]
     kind: "" normal · "f" filler/slip (dimmed) · "r" the rhyme word (lands on beat 4, in the slot's colour) */
  var LYRICS = [
    [["اِ…", 0, "f"], ["یو،", 0.4, "f"], ["هر", 0.9, ""], ["زمستون", 1.15, ""], ["دلم", 1.7, ""], ["لک", 2.1, ""], ["زده", 2.35, ""], ["واسه", 2.7, ""], ["بهار", 3, "r"]],
    [["با", 0, ""], ["رفیقا", 0.25, ""], ["سرِ", 0.75, ""], ["کوچه…", 1, ""], ["نه", 1.5, "f"], ["نه،", 1.7, "f"], ["سرِ", 2.1, ""], ["پارک", 2.35, ""], ["—", 2.7, ""], ["قرار", 3, "r"]],
    [["هه…", 0, "f"], ["ما", 0.5, ""], ["بزرگ‌شده‌ی", 0.75, ""], ["همین…", 1.6, "f"], ["همین", 2.2, ""], ["خیابون", 3, "r"]]
  ];
  function lyricLine(gb) {
    var line = Math.floor(gb / 4); if (line < 0 || line >= LYRICS.length) return;
    var inBar = gb - line * 4;
    var y = 1640;
    g.save();
    text("نمونه‌ی فری‌استایل", W / 2, y - 120, 36, C.muted, BODY);
    // lay out the WHOLE line first (each word in its own font), shrink it to fit, then reveal words on their beats
    var all = LYRICS[line], k = 1;
    function fontOf(t, scale) { return t[2] === "r" ? (92 * scale) + "px " + DISPLAY : "700 " + (64 * scale) + "px " + BODY; }
    function widthOf(t, scale) { g.font = fontOf(t, scale); return g.measureText(t[0]).width; }
    var full = all.reduce(function (a, t) { return a + widthOf(t, 1); }, 0) + 18 * (all.length - 1);
    if (full > W - 120) k = (W - 120) / full;
    var sp = 18 * k, x = W / 2 + Math.min(full * k, W - 120) / 2;
    all.forEach(function (t) {
      var w = widthOf(t, k);
      if (inBar >= t[1]) {
        var age = inBar - t[1], p = clamp(age / 0.15), s = 1 + (1 - outBack(p)) * 0.25;
        var col = t[2] === "f" ? C.muted : t[2] === "r" ? C.r[WORDS[line][1]] : C.text;
        g.save(); g.translate(x - w / 2, y); g.scale(s, s); g.globalAlpha = clamp(age / 0.08);
        g.font = fontOf(t, k); g.fillStyle = col; g.textAlign = "center"; g.direction = "rtl"; g.textBaseline = "middle";
        g.fillText(t[0], 0, 0);
        g.restore();
      }
      x -= w + sp;
    });
    g.restore();
  }
  function sceneGame(beat) {
    var gb = beat - 8;                           // grid beats since gameplay started
    var a = clamp((beat - 8) / 0.5);
    g.save(); g.globalAlpha = a;
    text("تو فقط خالی‌ها رو پر کن", W / 2, 300, 96, C.text);
    text("توپ رو دنبال کن، قافیه رو روی ضرب چهارم بکوب", W / 2, 400, 40, C.muted, BODY);
    var rowH = 200, top = 640, pad = 70, gap = 18, unit = (W - pad * 2 - gap * 3) / 5.1, fr = [1, 1, 1, 2.1];
    var xs = [], x = W - pad;
    for (var i = 0; i < 4; i++) { var w = unit * fr[i]; x -= w; xs.push({ x: x, w: w }); x -= gap; }
    var pos = Math.max(0, gb / 4), whole = Math.floor(pos), frac = pos - whole;
    var scroll = whole + (frac > 0.8 ? (function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; })((frac - 0.8) / 0.2) : 0);
    g.save(); g.beginPath(); g.rect(0, top - 20, W, rowH * 4 + 40); g.clip();
    for (var r = Math.max(0, whole - 1); r <= whole + 4 && r < WORDS.length; r++) {
      var y = top + (r - scroll + 1) * rowH, d = r - whole;
      g.globalAlpha = a * (d < 0 ? 0.3 : d >= 3 ? 0.45 : 1);
      for (var c = 0; c < 4; c++) {
        var cell = xs[c], hit = d === 0 && Math.floor(gb - whole * 4) === c && (gb % 1) < 0.18;
        rr(cell.x, y + 12, cell.w, rowH - 24, 4);
        if (c === 3) {
          var col = C.r[WORDS[r][1]];
          g.fillStyle = col; g.fill();
          text(WORDS[r][0], cell.x + cell.w / 2, y + rowH / 2 + 6, 92, C.ink);
        } else {
          g.fillStyle = hit ? C.accent : C.surface; g.fill(); g.lineWidth = 4; g.strokeStyle = C.line; g.stroke();
          g.beginPath(); g.arc(cell.x + cell.w / 2, y + rowH / 2, 8, 0, Math.PI * 2); g.fillStyle = C.muted; g.fill();
        }
      }
    }
    // the bouncing ball
    g.globalAlpha = a;
    var bb = Math.max(0, gb), bi = Math.floor(bb), f = bb - bi;
    var b1 = Math.floor(bi / 4), c1 = bi % 4, b2 = Math.floor((bi + 1) / 4), c2 = (bi + 1) % 4;
    var y1 = top + (b1 - scroll + 1) * rowH, y2 = top + (b2 - scroll + 1) * rowH;
    var cx1 = xs[c1].x + xs[c1].w / 2, cx2 = xs[c2].x + xs[c2].w / 2, lift = rowH * 0.6 * 4 * f * (1 - f);
    var bx = cx1 + (cx2 - cx1) * f, by = y1 + (y2 - y1) * f + 16 - lift;
    g.beginPath(); g.arc(bx + 7, by + 7, 30, 0, Math.PI * 2); g.fillStyle = C.accent; g.fill();
    g.beginPath(); g.arc(bx, by, 30, 0, Math.PI * 2); g.fillStyle = C.text; g.fill();
    g.lineWidth = 7; g.strokeStyle = C.bg; g.stroke();
    g.restore(); g.restore();
    lyricLine(gb);
  }

  function sceneFeatures(beat) {   // bar 5: one card per beat
    var b = beat - 20;
    var items = [["۱۸", "بیت اورجینال"], ["بیت‌باکس", "و اولد اسکول"], ["مهمونی", "نوبتی بخونین"], ["چالش", "هر روز یه چالش تازه"]];
    for (var i = 0; i < 4; i++) {
      if (b < i) continue;
      var p = pop(b, i, 0.4), y = 430 + i * 330, rot = (i % 2 ? 1 : -1) * 0.025;
      g.save(); g.translate(W / 2, y); g.rotate(rot); g.scale(p.s, p.s); g.globalAlpha = p.a;
      rr(-430, -130, 860, 260, 6); g.fillStyle = i === 0 ? C.accent : C.surface; g.fill();
      g.lineWidth = 6; g.strokeStyle = i === 0 ? C.accent : C.text; g.stroke();
      text(items[i][0], 400, -14, 130, i === 0 ? C.ink : C.accent, DISPLAY, "right");
      text(items[i][1], -400, 6, 62, i === 0 ? C.ink : C.text, BODY, "left");
      g.restore();
    }
  }

  /* ---------- small drawings ---------- */
  function noteIcon(x, y, s, color) {   // a ♪ drawn with shapes (fonts may lack the glyph)
    g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 9;
    g.beginPath(); g.ellipse(-22, 40, 26, 19, -0.4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(2, 36); g.lineTo(2, -60); g.stroke();
    g.beginPath(); g.moveTo(2, -60); g.quadraticCurveTo(40, -40, 34, -6); g.stroke();
    g.restore();
  }
  function shareIcon(x, y, s, color) {
    g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 6;
    g.beginPath(); g.moveTo(-18, 0); g.lineTo(18, -20); g.moveTo(-18, 0); g.lineTo(18, 20); g.stroke();
    [[-18, 0], [18, -20], [18, 20]].forEach(function (p) { g.beginPath(); g.arc(p[0], p[1], 11, 0, Math.PI * 2); g.fill(); });
    g.restore();
  }
  /* a phone showing the game's recording; withCam = selfie behind the grid */
  function phone(cx, cy, beat, withCam, a) {
    var w = 400, h = 760, x = cx - w / 2, y = cy - h / 2;
    g.save(); g.globalAlpha = a;
    rr(x - 14, y - 14, w + 28, h + 28, 46); g.fillStyle = "#26251f"; g.fill();
    rr(x, y, w, h, 34); g.fillStyle = withCam ? "#2b2a26" : C.bg; g.fill();
    g.save(); rr(x, y, w, h, 34); g.clip();
    if (withCam) {   // a simple person silhouette as the camera image
      var grd = g.createLinearGradient(0, y, 0, y + h); grd.addColorStop(0, "#4a463e"); grd.addColorStop(1, "#1d1c19");
      g.fillStyle = grd; g.fillRect(x, y, w, h);
      g.fillStyle = "#8a7f70";
      g.beginPath(); g.arc(cx, y + 250, 92, 0, Math.PI * 2); g.fill();                    // head
      g.beginPath(); g.ellipse(cx, y + 520, 175, 150, 0, Math.PI, 0); g.fill();           // shoulders
      g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(x, y + h * 0.56, w, h * 0.44);          // dark band behind the grid
    }
    // mini rhyme grid
    var rows = [["بهار", 0], ["قرار", 0], ["خیابون", 1]], top = y + h * 0.6, rh = 78;
    for (var r = 0; r < 3; r++) {
      var ry = top + r * rh, cell = (w - 60 - 3 * 8) / 5.1, xr = x + w - 30;   // RTL: beat 1 on the right
      for (var c = 0; c < 4; c++) {
        var cw = c === 3 ? cell * 2.1 : cell, cx2 = xr - cw;
        xr = cx2 - 8;
        rr(cx2, ry, cw, rh - 14, 4);
        if (c === 3) { g.fillStyle = C.r[rows[r][1]]; g.fill(); text(rows[r][0], cx2 + cw / 2, ry + (rh - 14) / 2 + 3, 34, C.ink); }
        else { g.fillStyle = r === 0 && Math.floor(beat % 4) === c ? C.accent : "rgba(30,30,28,.85)"; g.fill(); }
      }
    }
    // header: brand + REC
    text("قافیه‌باز", x + w - 30, y + 60, 44, C.text, DISPLAY, "right");
    if (Math.floor(beat * 2) % 2 === 0) {
      rr(x + 24, y + 38, 96, 44, 22); g.fillStyle = "#e5322d"; g.fill();
      g.direction = "ltr"; g.font = "700 26px " + BODY; g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("REC", x + 72, y + 61);
    }
    g.restore();
    g.restore();
  }

  function sceneUpload(beat) {   // bar 6: bring your own beat
    var b = beat - 24, t = pop(b, 0, 0.45);
    g.save(); g.translate(W / 2, 330); g.scale(t.s, t.s); g.globalAlpha = t.a; inkText("بیت خودت رو بیار", 0, 0, 130); g.restore();
    // drop zone
    var zx = W / 2, zy = 1000;
    g.save(); g.globalAlpha = clamp(b / 0.4);
    rr(zx - 380, zy - 230, 760, 460, 10); g.setLineDash([24, 16]); g.lineWidth = 6; g.strokeStyle = C.muted; g.stroke(); g.setLineDash([]);
    g.restore();
    // the MP3 file falls in on beat 1
    var fall = outBack((b - 0.5) / 0.6), fy = zy - 520 + fall * 520;
    if (b > 0.5) {
      g.save(); g.translate(zx, fy); g.rotate((1 - clamp((b - 0.5) / 0.6)) * -0.25);
      g.beginPath(); g.moveTo(-130, -160); g.lineTo(70, -160); g.lineTo(130, -100); g.lineTo(130, 160); g.lineTo(-130, 160); g.closePath();
      g.fillStyle = C.text; g.fill();
      g.beginPath(); g.moveTo(70, -160); g.lineTo(70, -100); g.lineTo(130, -100); g.closePath(); g.fillStyle = "#c9c2b3"; g.fill();
      noteIcon(-6, -30, 1.1, C.accent);
      g.direction = "ltr"; g.font = "800 46px " + BODY; g.fillStyle = C.ink; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("MP3", 0, 110);
      g.restore();
    }
    // tempo detection: counter spins up, then locks with a tick
    if (b > 1.6) {
      var spin = clamp((b - 1.6) / 0.8), shown = b < 2.4 ? Math.round(60 + spin * 32 + Math.sin(b * 40) * 3) : 92;
      g.save(); g.globalAlpha = clamp((b - 1.6) / 0.2);
      text(QB_fa(shown) + " BPM" + (b >= 2.4 ? "  ✓" : ""), W / 2, 1380, 92, b >= 2.4 ? C.accent : C.text, DISPLAY);
      g.restore();
    }
    if (b > 2.6) { var u = pop(b, 2.6, 0.4); g.save(); g.globalAlpha = u.a; text("سرعتش رو خودمون پیدا می‌کنیم", W / 2, 1520, 60, C.text, BODY); g.restore(); }
  }

  function sceneRecord(beat) {   // bar 7: record & share, with or without the camera
    var b = beat - 28, t = pop(b, 0, 0.45);
    g.save(); g.translate(W / 2, 250); g.scale(t.s, t.s); g.globalAlpha = t.a; inkText("ضبط کن، بفرست", 0, 0, 130); g.restore();
    var p1 = pop(b, 0.5, 0.45), p2 = pop(b, 1.2, 0.45);
    g.save(); g.translate(W * 0.74, 860); g.rotate(0.03); g.scale(p1.s * 0.92, p1.s * 0.92); phone(0, 0, beat, true, p1.a); g.restore();
    g.save(); g.translate(W * 0.26, 860); g.rotate(-0.03); g.scale(p2.s * 0.92, p2.s * 0.92); phone(0, 0, beat, false, p2.a); g.restore();
    if (b > 0.5) { g.save(); g.globalAlpha = p1.a; text("با دوربین", W * 0.74, 1290, 58, C.text, BODY); g.restore(); }
    if (b > 1.2) { g.save(); g.globalAlpha = p2.a; text("بدون دوربین", W * 0.26, 1290, 58, C.text, BODY); g.restore(); }
    if (b > 2.2) {
      var s = pop(b, 2.2, 0.45);
      g.save(); g.translate(W / 2, 1470); g.scale(s.s, s.s); g.globalAlpha = s.a;
      rr(-300, -80, 600, 160, 8); g.fillStyle = C.accent; g.fill();
      shareIcon(170, 0, 1.6, C.ink); text("اشتراک", -40, 6, 84, C.ink);
      g.restore();
    }
    if (b > 2.9) { var q = pop(b, 2.9, 0.4); g.save(); g.globalAlpha = q.a; text("استوری، تلگرام، واتس‌اپ…", W / 2, 1640, 54, C.muted, BODY); g.restore(); }
  }
  var FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";
  function QB_fa(n) { return String(n).replace(/[0-9]/g, function (d) { return FA_DIGITS[+d]; }); }

  function sceneLogo(beat) {   // bars 8–9: logo slam, tagline, call to action
    var b = beat - 32, slam = pop(b, 0, 0.35);
    var shake = b >= 0 && b < 0.3 ? (Math.random() - 0.5) * 18 * (1 - b / 0.3) : 0;
    g.save(); g.translate(W / 2 + shake, 640 + shake); g.scale(slam.s, slam.s); g.globalAlpha = slam.a;
    inkText("قافیه‌باز", 0, 0, 300); g.restore();
    if (b >= 1.5) { var t = pop(b, 1.5, 0.5); g.save(); g.globalAlpha = t.a; text("بازی تمرین فری‌استایل رپ", W / 2, 880, 64, C.muted, BODY); g.restore(); }
    if (b >= 2.5) { var t2 = pop(b, 2.5, 0.5); g.save(); g.globalAlpha = t2.a; text("واسه تمرین، دورهمی و مهمونی", W / 2, 965, 56, C.text, BODY); g.restore(); }
    if (b >= 4) {   // bar 7
      var c = pop(b, 4, 0.45);
      g.save(); g.translate(W / 2, 1130); g.scale(c.s, c.s); g.globalAlpha = c.a;
      rr(-400, -95, 800, 190, 6); g.fillStyle = C.accent; g.fill();
      text("همین الان بازی کن", 0, 4, 104, C.ink); g.restore();
    }
    if (b >= 5) {
      var u = pop(b, 5, 0.4);
      g.save(); g.globalAlpha = u.a; g.direction = "ltr";
      g.font = "600 50px Vazirmatn, sans-serif"; g.fillStyle = C.text; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("awlirezaz.github.io/qafiyeh-baz", W / 2, 1330); g.restore();
    }
    if (b >= 6) {
      var z = pop(b, 6, 0.45);
      g.save(); g.translate(W / 2, 1530); g.rotate(-0.04); g.scale(z.s, z.s); g.globalAlpha = z.a;
      rr(-330, -70, 660, 140, 6); g.fillStyle = C.r[1]; g.fill();
      text("به‌زودی در کافه‌بازار", 0, 4, 76, C.ink); g.restore();
    }
  }

  function frame(beat) {
    background(beat);
    if (beat < 4) sceneHook(beat);
    else if (beat < 8) sceneTagline(beat);
    else if (beat < 20) sceneGame(beat);
    else if (beat < 24) sceneFeatures(beat);
    else if (beat < 28) sceneUpload(beat);
    else if (beat < 32) sceneRecord(beat);
    else sceneLogo(beat);
  }

  /* ---------- audio + playback ---------- */
  var ctx = null, buf = null, bpm = BPM_HINT;
  function prepare() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    var fontsReady = Promise.all([document.fonts.load("100px Lalezar", "قافیه"), document.fonts.load("600 50px Vazirmatn", "قافیه a")]);
    var audio = buf ? Promise.resolve(buf) : fetch(BEAT_URL).then(function (r) { if (!r.ok) throw new Error("beat " + r.status); return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (res, rej) { ctx.decodeAudioData(ab, res, rej); }); })
      .then(function (b) { buf = b; var bars = Math.max(1, Math.round(b.duration * BPM_HINT / 240)); bpm = bars * 240 / b.duration; return b; });
    return Promise.all([fontsReady, audio]);
  }
  /* plays the teaser once; `dest` (optional) also receives the audio for recording */
  var stats = { frames: 0, lastBeat: 0 };
  function play(dest, useTimer) {
    // recording runs in a background browser, where animation frames are throttled → drive it with a timer instead
    var tick = useTimer ? function (fn) { setTimeout(fn, 1000 / 60); } : requestAnimationFrame;
    stats.frames = 0;
    var t0 = ctx.currentTime + 0.25, beatDur = 60 / bpm, total = BARS * 4 * beatDur;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(1, t0 + total - 0.6);
    gain.gain.linearRampToValueAtTime(0, t0 + total);
    src.connect(gain); gain.connect(ctx.destination); if (dest) gain.connect(dest);
    src.start(t0, START_BAR * 240 / bpm); src.stop(t0 + total + 0.1);
    return new Promise(function (done) {
      (function loop() {
        var t = ctx.currentTime - t0;
        frame(Math.max(0, t / beatDur));
        stats.frames++; stats.lastBeat = t / beatDur;
        if (t < total + 0.15) tick(loop); else done();
      })();
    });
  }

  document.getElementById("play").onclick = function () {
    this.disabled = true;
    prepare().then(function () { return ctx.resume(); }).then(function () { return play(); }).then(function () { document.getElementById("play").disabled = false; });
  };
  frame(34.5);   // a still of the ending as the page's resting state

  /* Renders the teaser to an MP4, frame by frame (not in real time): every frame is drawn at its exact
     timestamp and encoded with WebCodecs; the audio is rendered offline. Uses Mediabunny (dev dependency),
     so it needs the project served over http — scripts/render-teaser.mjs does that. Returns { base64, … }. */
  window.renderTeaser = async function () {
    await prepare();
    var MB = await import("../node_modules/mediabunny/dist/bundles/mediabunny.min.mjs");
    var fps = 30, beatDur = 60 / bpm, total = BARS * 4 * beatDur;

    // audio: the loop, with a short fade at the end, rendered offline
    var sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(sr * total), sr);
    var s = oc.createBufferSource(); s.buffer = buf;
    var fade = oc.createGain();
    fade.gain.setValueAtTime(0.86, 0);   // ~1 dB headroom: the loop's peaks go slightly over full scale
    fade.gain.setValueAtTime(0.86, total - 0.6); fade.gain.linearRampToValueAtTime(0, total);
    s.connect(fade); fade.connect(oc.destination); s.start(0, START_BAR * 240 / bpm);
    var audio = await oc.startRendering();

    var target = new MB.BufferTarget();
    var output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: "in-memory" }), target: target });
    var video = new MB.CanvasSource(canvas, { codec: "avc", bitrate: 8000000, keyFrameInterval: 2 });
    output.addVideoTrack(video, { frameRate: fps });
    var acodec = (await MB.canEncodeAudio("aac")) ? "aac" : "opus";
    var sound = new MB.AudioBufferSource({ codec: acodec, bitrate: 192000 });
    output.addAudioTrack(sound);
    await output.start();

    var n = Math.round(total * fps);
    for (var i = 0; i < n; i++) {
      var t = i / fps;
      frame(t / beatDur);
      await video.add(t, 1 / fps);
    }
    await sound.add(audio);
    await output.finalize();

    var bytes = new Uint8Array(target.buffer), bin = "";
    for (var j = 0; j < bytes.length; j += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
    return { base64: btoa(bin), mime: "video/mp4 (H.264 + " + acodec + ")", bpm: bpm, seconds: total, frames: n };
  };
})();
</script>
</body>
